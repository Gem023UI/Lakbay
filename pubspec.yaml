name: flutter_application_1
description: "Lakbay Lens"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_translation: ^0.13.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_tts: ^4.2.2
  image_cropper: ^8.0.2
  cupertino_icons: ^1.0.8
  image: ^4.10.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/flags/
    - assets/data/
    - assets/images/countries/thailand/place/
    - assets/images/countries/thailand/dish/
    - assets/images/countries/thailand/festival/
    - assets/images/countries/indonesia/place/
    - assets/images/countries/indonesia/dish/
    - assets/images/countries/indonesia/festival/
    - assets/images/countries/philippines/place/
    - assets/images/countries/philippines/dish/
    - assets/images/countries/philippines/fesitval/
    - assets/images/countries/vietnam/place/
    - assets/images/countries/vietnam/dish/
    - assets/images/countries/vietnam/festival/

  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700